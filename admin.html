<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Ramouz — Admin</title>
  <link rel="icon" href="favicon.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Playfair+Display:ital,wght@1,600&display=swap" rel="stylesheet" />
  <style>
    *{box-sizing:border-box}
    :root{
      --bg-0:#0b1020; --bg-1:#131426; --bg-2:#1a1428;
      --cream:#fff8ef; --sand:#d19b64; --gold:#f0c38d; --gold-hi:#f6d9ac;
      --line:rgba(240,195,141,.22); --line-soft:rgba(255,248,239,.06);
      --dim:rgba(255,248,239,.55); --dim-2:rgba(255,248,239,.38);
      --ease:cubic-bezier(.22,.9,.3,1);
      --spring:cubic-bezier(.34,1.56,.64,1);
    }
    html{scrollbar-color:rgba(209,155,100,.4) transparent}
    ::-webkit-scrollbar{width:10px}
    ::-webkit-scrollbar-thumb{background:rgba(209,155,100,.3);border-radius:99px;border:3px solid var(--bg-0)}
    body{
      margin:0;min-height:100svh;padding:0 0 90px;
      font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:var(--cream);
      background:
        radial-gradient(1100px 600px at 15% -10%,rgba(209,155,100,.14),transparent 55%),
        radial-gradient(900px 600px at 95% 15%,rgba(110,90,160,.12),transparent 55%),
        radial-gradient(700px 500px at 50% 110%,rgba(142,161,91,.07),transparent 60%),
        linear-gradient(170deg,var(--bg-0),var(--bg-1) 55%,var(--bg-2));
      background-attachment:fixed;
    }
    button{font:inherit}
    :focus-visible{outline:2px solid var(--sand);outline-offset:2px;border-radius:6px}

    @keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
    @keyframes popIn{from{opacity:0;transform:scale(.94) translateY(10px)}to{opacity:1;transform:scale(1) translateY(0)}}
    @keyframes overlayIn{from{opacity:0}to{opacity:1}}
    @keyframes rowIn{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:translateX(0)}}
    @keyframes goldShimmer{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
    @keyframes savePulse{0%{box-shadow:0 10px 26px rgba(209,155,100,.3),0 0 0 0 rgba(240,195,141,.55)}70%{box-shadow:0 10px 26px rgba(209,155,100,.3),0 0 0 12px rgba(240,195,141,0)}100%{box-shadow:0 10px 26px rgba(209,155,100,.3),0 0 0 0 rgba(240,195,141,0)}}
    @keyframes notePop{0%{opacity:0;transform:scale(.6)}60%{opacity:1;transform:scale(1.12)}100%{opacity:1;transform:scale(1)}}

    /* ============ top bar ============ */
    .topbar{
      position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:12px;row-gap:8px;flex-wrap:wrap;
      padding:14px clamp(16px,4vw,40px);
      background:rgba(11,16,32,.78);backdrop-filter:blur(20px) saturate(1.3);
      border-bottom:1px solid transparent;
      border-image:linear-gradient(90deg,transparent,rgba(240,195,141,.4),transparent) 1;
    }
    .topbar .brand{
      font-family:"Playfair Display",Georgia,serif;font-style:italic;font-weight:600;font-size:27px;
      background:linear-gradient(100deg,#c98a45 10%,var(--gold-hi) 40%,#e0ad71 60%,#f9e6c5 75%,#c98a45 90%);
      background-size:220% 100%;
      -webkit-background-clip:text;background-clip:text;color:transparent;
      animation:goldShimmer 5s ease-in-out infinite;
    }
    .topbar .tag{
      font-size:10px;letter-spacing:.2em;text-transform:uppercase;font-weight:800;
      color:var(--bg-0);background:linear-gradient(135deg,var(--sand),var(--gold));
      padding:5px 11px;border-radius:999px;box-shadow:0 4px 14px rgba(209,155,100,.35);
    }
    .topbar-actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:flex-end;margin-left:auto}
    .save-btn{
      display:none;align-items:center;gap:8px;border:0;cursor:pointer;
      font-weight:800;font-size:13px;color:var(--bg-0);
      background:linear-gradient(135deg,var(--sand),var(--gold));
      padding:10px 20px;border-radius:999px;
      transition:transform .25s var(--spring);
      animation:savePulse 1.8s ease-out 2;
    }
    .save-btn.show{display:inline-flex}
    .save-btn:hover{transform:translateY(-2px) scale(1.03)}
    .save-btn:active{transform:scale(.97)}
    .save-btn:disabled{opacity:.6;cursor:wait;transform:none}
    .save-note{font-size:12.5px;font-weight:800;color:#9fd6a9;display:none}
    .save-note.show{display:inline;animation:notePop .45s var(--spring) both}
    .topbar a.back,.signout-btn{
      color:var(--dim);font-size:13px;font-weight:700;text-decoration:none;cursor:pointer;
      border:1px solid var(--line);border-radius:999px;padding:8px 16px;background:transparent;
      transition:color .25s ease,border-color .25s ease,background .25s ease,transform .25s ease;
    }
    .topbar a.back:hover{color:var(--cream);border-color:var(--gold);transform:translateY(-1px)}
    .signout-btn:hover{color:#e08f8f;border-color:rgba(224,110,110,.5);transform:translateY(-1px)}

    /* ============ layout ============ */
    .wrap{max-width:900px;margin:0 auto;padding:38px clamp(14px,4vw,28px) 0}
    .summary{color:var(--dim);font-size:14px;margin:0 0 30px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;animation:fadeUp .5s var(--ease) both}
    .summary strong{color:var(--gold)}
    .stat{
      display:inline-flex;align-items:baseline;gap:6px;font-size:12.5px;font-weight:700;color:var(--dim);
      background:rgba(255,248,239,.045);border:1px solid var(--line-soft);
      border-radius:999px;padding:6px 14px;
    }
    .stat b{font-size:15px;font-weight:900;color:var(--gold);font-variant-numeric:tabular-nums}
    .summary-hint{font-size:12px;color:var(--dim-2);margin-left:2px}

    .category{margin:0 0 46px;animation:fadeUp .6s var(--ease) both}
    .category:nth-child(2){animation-delay:.06s}
    .category:nth-child(3){animation-delay:.12s}
    .category:nth-child(4){animation-delay:.18s}
    .category:nth-child(5){animation-delay:.24s}
    .cat-head{
      display:flex;align-items:center;gap:14px;margin:0 0 16px;
      font-size:13px;letter-spacing:.24em;text-transform:uppercase;font-weight:900;color:var(--sand);
    }
    .cat-head::before{content:"";width:22px;height:2px;border-radius:2px;background:var(--sand);flex:none}
    .cat-head::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
    .cat-head .n{color:var(--dim-2);letter-spacing:.05em;font-weight:700;text-transform:none;font-size:12px;flex:none}
    .cat-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

    /* ============ section cards ============ */
    .section{
      border:1px solid var(--line);border-radius:22px;overflow:hidden;margin:0 0 16px;
      background:linear-gradient(170deg,rgba(255,248,239,.045),rgba(255,248,239,.015));
      transition:border-color .35s ease,box-shadow .35s ease,transform .35s var(--ease);
    }
    .section:hover{border-color:rgba(240,195,141,.4);transform:translateY(-2px);box-shadow:0 16px 44px rgba(0,0,0,.35)}
    .section.open{
      border-color:rgba(240,195,141,.45);
      box-shadow:0 20px 60px rgba(0,0,0,.4),0 0 40px rgba(224,173,113,.07);
    }
    .sec-head{
      width:100%;display:flex;align-items:center;gap:13px;padding:16px 18px;
      background:transparent;border:0;color:inherit;cursor:pointer;text-align:left;
      transition:background .3s ease;
    }
    .sec-head:hover{background:rgba(240,195,141,.05)}
    .sec-icon{
      display:grid;place-items:center;width:40px;height:40px;flex:none;border-radius:13px;
      background:linear-gradient(135deg,rgba(240,195,141,.2),rgba(209,155,100,.12));
      border:1px solid rgba(240,195,141,.3);color:var(--gold);
      transition:transform .45s var(--spring),background .3s ease,color .3s ease,box-shadow .3s ease;
    }
    .sec-icon svg{width:19px;height:19px}
    .section.open .sec-icon{
      background:linear-gradient(135deg,#e0ad71,#c98a45);color:#231303;
      transform:scale(1.08) rotate(-6deg);box-shadow:0 0 24px rgba(224,173,113,.4);
    }
    .cat-tea-matcha .sec-icon{
      background:linear-gradient(135deg,rgba(142,161,91,.28),rgba(142,161,91,.12));
      border-color:rgba(163,184,110,.4);color:#c4d49a;
    }
    .cat-tea-matcha .section.open .sec-icon,.cat-tea-matcha.section.open .sec-icon{
      background:linear-gradient(135deg,#9db273,#6e8143);color:#131a08;box-shadow:0 0 24px rgba(142,161,91,.4);
    }
    .cat-cold .sec-icon{
      background:linear-gradient(135deg,rgba(143,185,214,.26),rgba(110,162,196,.12));
      border-color:rgba(143,185,214,.4);color:#a8cbe2;
    }
    .cat-cold.section.open .sec-icon{
      background:linear-gradient(135deg,#8fb9d6,#4c7d9c);color:#0a1620;box-shadow:0 0 24px rgba(110,162,196,.4);
    }
    .cat-fit .sec-icon{
      background:linear-gradient(135deg,rgba(125,191,168,.26),rgba(87,164,136,.12));
      border-color:rgba(125,191,168,.4);color:#9fd8c2;
    }
    .cat-fit.section.open .sec-icon{
      background:linear-gradient(135deg,#7dbfa8,#3d8069);color:#0b1a14;box-shadow:0 0 24px rgba(87,164,136,.4);
    }
    .sec-title{font-family:"Playfair Display",Georgia,serif;font-style:italic;font-weight:600;font-size:20px;letter-spacing:-.01em;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .sec-count{margin-left:auto;font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:var(--dim-2);flex:none}
    .sec-chev{
      width:28px;height:28px;display:grid;place-items:center;border-radius:50%;flex:none;
      border:1px solid var(--line);color:var(--gold);
      transition:transform .5s var(--spring),background .3s ease;
    }
    .sec-chev svg{width:13px;height:13px}
    .section.open .sec-chev{transform:rotate(180deg) scale(1.08);background:rgba(240,195,141,.1)}
    .sec-body{display:none;border-top:1px solid var(--line)}
    .section.open .sec-body{display:block}
    .section.open .sec-body .row{animation:rowIn .45s var(--ease) both}
    .section.open .sec-body .row:nth-child(1){animation-delay:.03s}
    .section.open .sec-body .row:nth-child(2){animation-delay:.07s}
    .section.open .sec-body .row:nth-child(3){animation-delay:.11s}
    .section.open .sec-body .row:nth-child(4){animation-delay:.15s}
    .section.open .sec-body .row:nth-child(5){animation-delay:.19s}
    .section.open .sec-body .row:nth-child(6){animation-delay:.23s}
    .section.open .sec-body .row:nth-child(7){animation-delay:.27s}
    .section.open .sec-body .row:nth-child(8){animation-delay:.31s}

    .subhead{
      display:flex;align-items:center;gap:10px;padding:14px 18px 4px;
      font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;font-weight:900;color:var(--sand);
    }
    .subhead::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}

    /* ============ item rows ============ */
    .row{
      display:flex;align-items:center;gap:10px;padding:12px 18px 12px 10px;background:transparent;
      transition:background .25s ease;
    }
    .row:hover{background:rgba(240,195,141,.045)}
    .row + .row{border-top:1px solid var(--line-soft)}
    .row.dragging{
      background:rgba(240,195,141,.1);border-radius:14px;
      box-shadow:0 14px 36px rgba(0,0,0,.45),0 0 0 1px rgba(240,195,141,.35);
      position:relative;z-index:5;
    }
    .grip{
      width:28px;height:38px;flex:none;display:grid;place-items:center;
      color:rgba(255,248,239,.3);cursor:grab;touch-action:none;border-radius:9px;
      transition:color .25s ease,background .25s ease;
    }
    .grip:hover{color:var(--gold);background:rgba(240,195,141,.09)}
    .row.dragging .grip{cursor:grabbing;color:var(--gold)}
    .grip svg{width:14px;height:14px}
    .grip-sm{width:24px;height:30px;margin-right:-4px}
    .grip-sm svg{width:12px;height:12px}
    .section.dragging{box-shadow:0 18px 48px rgba(0,0,0,.5),0 0 0 1px rgba(240,195,141,.4);opacity:.95}
    .category.dragging{opacity:.92}
    .category.dragging .cat-head{color:var(--gold)}
    .thumb{
      width:48px;height:48px;flex:none;border-radius:12px;overflow:hidden;
      background:linear-gradient(150deg,#2a2337,#1a1c2e);
      box-shadow:inset 0 0 0 1px rgba(255,248,239,.07);
      transition:transform .35s var(--spring),box-shadow .3s ease;
    }
    .row:hover .thumb{transform:scale(1.06);box-shadow:inset 0 0 0 1px rgba(240,195,141,.35),0 6px 18px rgba(0,0,0,.35)}
    .thumb img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
    .thumb-brand img{object-fit:contain;padding:6px}
    .row-main{flex:1;min-width:0}
    .row-top{display:flex;align-items:baseline;gap:10px}
    .item-name{font-weight:800;font-size:14.5px;transition:color .25s ease;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .row:hover .item-name{color:var(--gold-hi)}
    .dots{flex:1;min-width:0;border-bottom:1px dotted rgba(240,195,141,.28);transform:translateY(-3px);transition:border-color .25s ease}
    .row:hover .dots{border-color:rgba(240,195,141,.6)}
    .price{font-weight:900;font-size:14px;color:var(--gold);font-variant-numeric:tabular-nums;flex-shrink:0}
    .desc{margin:3px 0 0;font-size:12.5px;line-height:1.55;color:var(--dim)}
    .chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
    .chip{
      font-size:10.5px;font-weight:800;letter-spacing:.02em;color:var(--gold);
      background:rgba(209,155,100,.12);border:1px solid rgba(209,155,100,.3);
      border-radius:999px;padding:2.5px 9px;
    }
    .row-off{opacity:.45}
    .chip-off{color:#e08f8f;background:rgba(224,110,110,.12);border-color:rgba(224,110,110,.35);flex-shrink:0}

    /* ============ action buttons ============ */
    .edit-btn{
      width:29px;height:29px;flex:none;display:grid;place-items:center;align-self:center;
      border:1px solid var(--line-soft);border-radius:9px;background:transparent;
      color:rgba(255,248,239,.4);cursor:pointer;
      transition:color .25s ease,border-color .25s ease,background .25s ease,transform .25s var(--spring);
    }
    .edit-btn:hover{color:var(--gold);border-color:var(--gold);background:rgba(240,195,141,.08);transform:scale(1.1)}
    .edit-btn:active{transform:scale(.94)}
    .edit-btn svg{width:13px;height:13px}
    .del-btn:hover{color:#e08f8f;border-color:rgba(224,110,110,.5);background:rgba(224,110,110,.08)}
    .avail-btn{color:#7fd68a;border-color:rgba(127,214,138,.35)}
    .avail-btn:hover{color:#7fd68a;border-color:#7fd68a;background:rgba(127,214,138,.1)}
    .avail-btn.avail-off{color:#e08f8f;border-color:rgba(224,110,110,.35)}
    .avail-btn.avail-off:hover{color:#e08f8f;border-color:#e08f8f;background:rgba(224,110,110,.08)}
    .sec-edit{margin-left:2px}

    /* ============ forms ============ */
    .row-form{display:grid;gap:10px;padding:6px 0;animation:fadeUp .35s var(--ease) both}
    .rf-line{display:grid;grid-template-columns:1fr 112px;gap:10px}
    .row-form input,.row-form textarea,.sec-form input{
      width:100%;font:inherit;font-size:13.5px;color:var(--cream);
      background:rgba(255,248,239,.055);border:1px solid var(--line);border-radius:11px;
      padding:9px 12px;outline:none;resize:vertical;
      transition:border-color .25s ease,background .25s ease,box-shadow .25s ease;
    }
    .row-form input:focus,.row-form textarea:focus,.sec-form input:focus{
      border-color:var(--gold);background:rgba(255,248,239,.08);
      box-shadow:0 0 0 3px rgba(240,195,141,.15);
    }
    .rf-check{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--dim);cursor:pointer}
    .rf-check input{width:auto;accent-color:var(--sand);transform:scale(1.15)}
    .rf-actions{display:flex;gap:8px}
    .rf-actions button{
      border:0;cursor:pointer;font-weight:800;font-size:12.5px;padding:9px 20px;border-radius:999px;
      transition:transform .25s var(--spring),opacity .2s ease;
    }
    .rf-actions button:hover{transform:translateY(-1px)}
    .rf-actions button:active{transform:scale(.96)}
    .rf-save{color:var(--bg-0);background:linear-gradient(135deg,var(--sand),var(--gold));box-shadow:0 8px 22px rgba(209,155,100,.28)}
    .rf-save:disabled{opacity:.6;cursor:wait;transform:none}
    .rf-cancel{color:var(--dim);background:rgba(255,248,239,.07)}
    .rf-cancel:hover{color:var(--cream)}
    .rf-confirm{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:6px 0;animation:fadeUp .3s var(--ease) both}
    .rf-confirm-msg{font-size:13.5px;font-weight:700;color:#e0a6a6}
    .rf-confirm button{border:0;cursor:pointer;font-weight:800;font-size:12.5px;padding:9px 20px;border-radius:999px;transition:transform .25s var(--spring)}
    .rf-confirm button:hover{transform:translateY(-1px)}
    .rf-del{color:#fff;background:linear-gradient(135deg,#c85555,#a03737);box-shadow:0 8px 22px rgba(200,85,85,.3)}
    .rf-del:disabled{opacity:.6;cursor:wait}

    .row-add{padding:14px 18px;border-top:1px solid var(--line-soft)}
    .add-wrap{padding:12px 18px 16px;border-top:1px solid var(--line-soft)}
    .add-sec-wrap{margin:0 0 14px}
    .add-cat-wrap{margin:6px 0 60px}
    .cat-form{
      border:1px solid var(--line);border-radius:18px;margin:0 0 16px;
      background:linear-gradient(170deg,rgba(240,195,141,.06),rgba(255,248,239,.02));
    }
    .cat-name{margin-right:2px}
    .emoji-opt{font-size:19px;line-height:1}
    .emoji-grid{max-height:150px;overflow-y:auto;padding:2px}
    .cat-color-row{gap:10px}
    .cat-color{
      inline-size:44px;block-size:30px;padding:2px;border:1px solid var(--line);
      border-radius:8px;background:transparent;cursor:pointer;
    }
    .cat-color:disabled{opacity:.35;cursor:default}
    .section.has-tint .sec-icon{
      background:linear-gradient(135deg,color-mix(in srgb,var(--cat-tint) 28%,transparent),color-mix(in srgb,var(--cat-tint) 12%,transparent));
      border-color:color-mix(in srgb,var(--cat-tint) 42%,transparent);
      color:color-mix(in srgb,var(--cat-tint) 60%,#fff8ef);
    }
    .section.has-tint.open .sec-icon{
      background:linear-gradient(135deg,color-mix(in srgb,var(--cat-tint) 80%,#fff),color-mix(in srgb,var(--cat-tint) 78%,#000));
      border-color:color-mix(in srgb,var(--cat-tint) 55%,#fff);
      color:#0b1020;
      box-shadow:0 0 24px color-mix(in srgb,var(--cat-tint) 45%,transparent);
    }
    .add-btn{
      width:100%;border:1px dashed rgba(240,195,141,.35);border-radius:14px;cursor:pointer;
      background:transparent;color:var(--gold);font-weight:800;font-size:13px;
      padding:11px;transition:background .3s ease,border-color .3s ease,transform .25s var(--spring),box-shadow .3s ease;
    }
    .add-btn:hover{
      background:rgba(240,195,141,.07);border-color:var(--gold);border-style:solid;
      transform:translateY(-1px);box-shadow:0 8px 24px rgba(209,155,100,.15);
    }
    .add-btn:active{transform:scale(.99)}

    .sec-form{
      display:grid;gap:12px;padding:16px 18px;border-top:1px solid var(--line);
      background:rgba(240,195,141,.045);animation:fadeUp .35s var(--ease) both;
    }
    .sec-form-title{margin:0;font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:900;color:var(--sand)}
    .icon-grid{display:flex;gap:8px;flex-wrap:wrap}
    .icon-opt{
      width:42px;height:42px;display:grid;place-items:center;cursor:pointer;
      border:1px solid var(--line);border-radius:12px;background:transparent;color:var(--gold);
      transition:border-color .25s ease,background .25s ease,transform .25s var(--spring),box-shadow .25s ease;
    }
    .icon-opt svg{width:19px;height:19px}
    .icon-opt:hover{border-color:var(--gold);transform:translateY(-2px) scale(1.05)}
    .icon-opt.selected{
      background:linear-gradient(135deg,var(--sand),var(--gold));color:var(--bg-0);
      border-color:transparent;box-shadow:0 8px 20px rgba(209,155,100,.35);transform:scale(1.05);
    }

    /* ============ photo field + crop ============ */
    .rf-photo{display:flex;align-items:center;gap:12px}
    .rf-photo-prev{width:54px;height:54px}
    .rf-photo-prev img{width:100%;height:100%;object-fit:cover}
    .rf-photo-btn{
      display:inline-block;cursor:pointer;font-size:12.5px;font-weight:800;color:var(--gold);
      border:1px dashed rgba(240,195,141,.4);border-radius:999px;padding:9px 18px;
      transition:border-color .25s ease,background .25s ease,transform .25s var(--spring);

  <script>
    const SUPABASE_URL = 'https://waibybqjhzddpfhzrisx.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndhaWJ5YnFqaHpkZHBmaHpyaXN4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQzODg4ODYsImV4cCI6MjA5OTk2NDg4Nn0.zufjm2J4F4mePJhd072hoXh5vLqfXNVuPFEN1BbKs3k';

    const root = document.querySelector('[data-menu-root]');
    const summaryEl = document.querySelector('[data-summary]');
    const saveBtn = document.querySelector('[data-save-btn]');
    const saveNote = document.querySelector('[data-save-note]');

    const el = (tag, cls, text) => {
      const n = document.createElement(tag);
      if (cls) n.className = cls;
      if (text != null) n.textContent = text;
      return n;
    };

    const CAT_SLUGS = {
      'Coffee Base': 'coffee-base',
      'Tea & Matcha': 'tea-matcha',
      'Cold & Refreshing': 'cold',
      'Bites': 'bites',
      'Fit': 'fit',
    };
    const bySort = (a, b) => (a.sort_order ?? 0) - (b.sort_order ?? 0);

    async function loadMenu() {
      const res = await fetch(
        `${SUPABASE_URL}/rest/v1/categories?select=*,sections(*,subsections(*),items(*,variants(*)))`,
        { headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}` } }
      );
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const cats = await res.json();
      return cats.sort(bySort).map(cat => ({
        id: cat.id,
        name: cat.name,
        name_ar: cat.name_ar || '',
        sort: cat.sort_order ?? 0,
        emoji: cat.emoji || '',
        color: cat.color || null,
        slug: CAT_SLUGS[cat.name] || cat.name.toLowerCase().replace(/[^a-z0-9]+/g, '-'),
        sections: (cat.sections || []).sort(bySort).map(sec => {
          const subs = new Map((sec.subsections || []).map(s => [s.id, s.name]));
          return {
            id: sec.id,
            name: sec.name,
            name_ar: sec.name_ar || '',
            icon: sec.icon,
            sort: sec.sort_order ?? 0,
            items: (sec.items || []).sort(bySort).map(item => ({
              id: item.id,
              name: item.name,
              name_ar: item.name_ar || '',
              price: Number(item.price).toFixed(3),
              desc: item.description,
              desc_ar: item.description_ar || '',
              img: item.image_url,
              sort: item.sort_order ?? 0,
              subsection: item.subsection_id != null ? subs.get(item.subsection_id) : null,
              variants: (item.variants || []).sort(bySort).map(v => v.name),
              available: item.is_available !== false,
            })),
          };
        }),
      }));
    }

    /* ---------- drag to reorder (pointer events: mouse + touch) ---------- */
    const GRIP_SVG = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="9" cy="5" r="1.7"/><circle cx="15" cy="5" r="1.7"/><circle cx="9" cy="12" r="1.7"/><circle cx="15" cy="12" r="1.7"/><circle cx="9" cy="19" r="1.7"/><circle cx="15" cy="19" r="1.7"/></svg>';
    let drag = null;

    function flipInsert(moved, doInsert) {
      const parent = moved.parentElement;
      const sibs = [...parent.children].filter(n => n !== moved);
      const before = new Map(sibs.map(n => [n, n.getBoundingClientRect().top]));
      doInsert();
      sibs.forEach(n => {
        const d = before.get(n) - n.getBoundingClientRect().top;
        if (!d) return;
        n.style.transition = 'none';
        n.style.transform = `translateY(${d}px)`;
        requestAnimationFrame(() => {
          n.style.transition = 'transform .28s cubic-bezier(.22,.9,.3,1)';
          n.style.transform = '';
        });
      });
    }

    // contiguous rows around this one, not crossing Sweet/Savoury dividers
    const dragGroup = (row) => {
      const group = [row];
      for (let n = row.previousElementSibling; n && n.classList.contains('row'); n = n.previousElementSibling) group.unshift(n);
      for (let n = row.nextElementSibling; n && n.classList.contains('row'); n = n.nextElementSibling) group.push(n);
      return group;
    };

    function startDrag(e, row) {
      e.preventDefault();
      drag = { row, body: row.parentElement };
      row.classList.add('dragging');
      window.addEventListener('pointermove', moveDrag);
      window.addEventListener('pointerup', endDrag, { once: true });
    }
    function moveDrag(e) {
      if (!drag) return;
      const { row } = drag;
      for (const sib of dragGroup(row)) {
        if (sib === row) continue;
        const r = sib.getBoundingClientRect();
        if (e.clientY < r.top + r.height / 2) {
          if (sib.previousElementSibling !== row) flipInsert(row, () => row.parentElement.insertBefore(row, sib));
          return;
        }
      }
      const group = dragGroup(row);
      const last = group[group.length - 1];
      if (last !== row) flipInsert(row, () => row.parentElement.insertBefore(row, last.nextElementSibling));
    }
    function startBoxDrag(e, box, selector, onDrop) {
      e.preventDefault();
      const parent = box.parentElement;
      box.classList.add('dragging');
      const move = (ev) => {
        const sibs = [...parent.children].filter(n => n !== box && n.matches(selector));
        for (const sib of sibs) {
          const r = sib.getBoundingClientRect();
          if (ev.clientY < r.top + r.height / 2) {
            if (sib.previousElementSibling !== box) flipInsert(box, () => parent.insertBefore(box, sib));
            return;
          }
        }
        const all = [...parent.children].filter(n => n.matches(selector));
        const last = all[all.length - 1];
        if (last !== box) flipInsert(box, () => parent.insertBefore(box, last.nextElementSibling));
      };
      const up = () => {
        box.classList.remove('dragging');
        window.removeEventListener('pointermove', move);
        onDrop();
        saveBtn.classList.add('show');
        saveNote.classList.remove('show');
      };
      window.addEventListener('pointermove', move);
      window.addEventListener('pointerup', up, { once: true });
    }

    function endDrag() {
      if (!drag) return;
      drag.row.classList.remove('dragging');
      drag.body.dataset.dirty = '1';
      drag = null;
      window.removeEventListener('pointermove', moveDrag);
      saveBtn.classList.add('show');
      saveNote.classList.remove('show');
    }

    /* ---------- item rows: display + inline edit ---------- */
    const EDIT_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/><path d="m15 5 4 4"/></svg>';
    const TRASH_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>';
    const EYE_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></svg>';
    const EYE_OFF_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 7 11 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61C3.06 8.9 1 12 1 12s4 7 11 7a9.26 9.26 0 0 0 5.39-1.61"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/><path d="M1 1l22 22"/></svg>';

    const TOKEN_KEY = 'ramouz_admin_token';
    const REFRESH_KEY = 'ramouz_admin_refresh';
    const TOKEN_AT_KEY = 'ramouz_admin_token_at';
    const restHeaders = () => ({
      apikey: SUPABASE_ANON_KEY,
      Authorization: `Bearer ${sessionStorage.getItem(TOKEN_KEY) || SUPABASE_ANON_KEY}`,
      'Content-Type': 'application/json',
      Prefer: 'return=representation',
    });

    const storeSession = (data) => {
      sessionStorage.setItem(TOKEN_KEY, data.access_token);
      if (data.refresh_token) sessionStorage.setItem(REFRESH_KEY, data.refresh_token);
      sessionStorage.setItem(TOKEN_AT_KEY, String(Date.now()));
    };

    // renew the session token before it expires (Supabase tokens last 1h)
    async function ensureFreshToken() {
      if (!sessionStorage.getItem(TOKEN_KEY)) return;
      const age = Date.now() - Number(sessionStorage.getItem(TOKEN_AT_KEY) || 0);
      if (age < 45 * 60 * 1000) return;
      const rt = sessionStorage.getItem(REFRESH_KEY);
      let ok = false;
      if (rt) {
        try {
          const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=refresh_token`, {
            method: 'POST',
            headers: { apikey: SUPABASE_ANON_KEY, 'Content-Type': 'application/json' },
            body: JSON.stringify({ refresh_token: rt }),
          });
          if (res.ok) { storeSession(await res.json()); ok = true; }
        } catch (e) { /* fall through */ }
      }
      if (!ok) {
        [TOKEN_KEY, REFRESH_KEY, TOKEN_AT_KEY].forEach(k => sessionStorage.removeItem(k));
        document.querySelector('[data-login]').classList.add('show');
        throw new Error('Session expired — please sign in again.');
      }
    }

    /* ---------- image upload: compress client-side, store in Supabase Storage ---------- */
    const BUCKET = 'menu-images';

    async function compressImage(file, maxDim = 1200, quality = 0.85) {
      try {
        const bitmap = await createImageBitmap(file);
        const scale = Math.min(1, maxDim / Math.max(bitmap.width, bitmap.height));
        const w = Math.round(bitmap.width * scale);
        const h = Math.round(bitmap.height * scale);
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(bitmap, 0, 0, w, h);
        const blob = await new Promise(r => canvas.toBlob(r, 'image/webp', quality));
        if (blob) return blob;
      } catch (e) { /* fall through: upload the original file */ }
      return file;
    }

    async function uploadImage(file) {
      await ensureFreshToken();
      const blob = await compressImage(file);
      const key = `items/${Date.now()}-${Math.random().toString(36).slice(2, 8)}.webp`;
      const res = await fetch(`${SUPABASE_URL}/storage/v1/object/${BUCKET}/${key}`, {
        method: 'POST',
        headers: {
          apikey: SUPABASE_ANON_KEY,
          Authorization: `Bearer ${sessionStorage.getItem(TOKEN_KEY) || SUPABASE_ANON_KEY}`,
          'Content-Type': 'image/webp',
          'x-upsert': 'true',
        },
        body: blob,
      });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.message || 'Photo upload failed — check the storage bucket and policies.');
      }
      return `${SUPABASE_URL}/storage/v1/object/public/${BUCKET}/${key}`;
    }

    // best-effort cleanup of a replaced/orphaned photo; old repo-path images are skipped
    const STORAGE_PUBLIC_PREFIX = `${SUPABASE_URL}/storage/v1/object/public/${BUCKET}/`;
    async function deleteStorageImage(url) {
      if (!url || !url.startsWith(STORAGE_PUBLIC_PREFIX)) return;
      const key = url.slice(STORAGE_PUBLIC_PREFIX.length);
      try {
        await fetch(`${SUPABASE_URL}/storage/v1/object/${BUCKET}/${key}`, {
          method: 'DELETE',
          headers: {
            apikey: SUPABASE_ANON_KEY,
            Authorization: `Bearer ${sessionStorage.getItem(TOKEN_KEY) || SUPABASE_ANON_KEY}`,
          },
        });
      } catch (e) {
        console.warn('[admin] could not delete old image:', e);
      }
    }

    /* ---------- crop picker: choose the square shown as the thumbnail ---------- */
    function cropImage(file) {
      return new Promise((resolve) => {
        const url = URL.createObjectURL(file);
        const img = new Image();
        img.onerror = () => { URL.revokeObjectURL(url); resolve(file); }; // undecodable: use as-is
        img.onload = () => {
          const overlay = el('div', 'crop-overlay');
          const card = el('div', 'crop-card');
          card.appendChild(el('p', 'crop-title', 'Position the photo'));
          const stage = el('div', 'crop-stage');
          const pic = document.createElement('img');
          pic.src = url; pic.alt = ''; pic.draggable = false;
          stage.appendChild(pic);
          card.appendChild(stage);
          const zoom = el('input', 'crop-zoom');
          zoom.type = 'range';
          card.appendChild(zoom);
          const actions = el('div', 'rf-actions crop-actions');
          const okB = el('button', 'rf-save', 'Use photo');
          okB.type = 'button';
          const cancelB = el('button', 'rf-cancel', 'Cancel');
          cancelB.type = 'button';
          actions.appendChild(okB);
          actions.appendChild(cancelB);
          card.appendChild(actions);
          overlay.appendChild(card);
          document.body.appendChild(overlay);

          const V = stage.clientWidth;
          const minScale = V / Math.min(img.naturalWidth, img.naturalHeight);
          let scale = minScale, tx = 0, ty = 0;

          const clamp = () => {
            tx = Math.min(0, Math.max(V - img.naturalWidth * scale, tx));
            ty = Math.min(0, Math.max(V - img.naturalHeight * scale, ty));
          };
          const paint = () => {
            pic.style.width = `${img.naturalWidth * scale}px`;
            pic.style.transform = `translate(${tx}px,${ty}px)`;
          };
          // start centered
          tx = (V - img.naturalWidth * scale) / 2;
          ty = (V - img.naturalHeight * scale) / 2;
          paint();

          zoom.min = '0'; zoom.max = '100'; zoom.value = '0';
          zoom.addEventListener('input', () => {
            const next = minScale * (1 + (Number(zoom.value) / 100) * 3);
            // keep the viewport centre anchored while zooming
            const cx = (V / 2 - tx) / scale;
            const cy = (V / 2 - ty) / scale;
            scale = next;
            tx = V / 2 - cx * scale;
            ty = V / 2 - cy * scale;
            clamp(); paint();
          });

          let dragFrom = null;
          stage.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            dragFrom = { x: e.clientX - tx, y: e.clientY - ty };
            stage.setPointerCapture(e.pointerId);
          });
          stage.addEventListener('pointermove', (e) => {
            if (!dragFrom) return;
            tx = e.clientX - dragFrom.x;
            ty = e.clientY - dragFrom.y;
            clamp(); paint();
          });
          stage.addEventListener('pointerup', () => { dragFrom = null; });

          const close = (result) => {
            overlay.remove();
            URL.revokeObjectURL(url);
            resolve(result);
          };
          cancelB.addEventListener('click', () => close(null));
          okB.addEventListener('click', () => {
            const OUT = 900;
            const canvas = document.createElement('canvas');
            canvas.width = OUT; canvas.height = OUT;
            canvas.getContext('2d').drawImage(
              img,
              -tx / scale, -ty / scale, V / scale, V / scale,
              0, 0, OUT, OUT
            );
            canvas.toBlob((blob) => close(blob || file), 'image/webp', 0.85);
          });
        };
        img.src = url;
      });
    }

    // photo field used by both the edit and add forms
    function photoField(currentUrl) {
      const wrap = el('div', 'rf-photo');
      const preview = el('span', 'thumb rf-photo-prev');
      const setPrev = (url) => {
        preview.textContent = '';
        if (url) {
          const im = document.createElement('img');
          im.src = url; im.alt = '';
          preview.appendChild(im);
        }
      };
      setPrev(currentUrl);
      const pick = el('label', 'rf-photo-btn', currentUrl ? 'Change photo' : 'Add photo');
      const input = el('input');
      input.type = 'file';
      input.accept = 'image/*';
      input.hidden = true;
      let pending = null;
      input.addEventListener('change', async () => {
        const file = input.files[0];
        input.value = '';
        if (!file) return;
        const cropped = await cropImage(file);
        if (!cropped) return; // cancelled in the crop dialog
        pending = cropped;
        setPrev(URL.createObjectURL(pending));
        pick.textContent = 'Photo selected ✓';
        pick.appendChild(input);
      });
      pick.appendChild(input);
      wrap.appendChild(preview);
      wrap.appendChild(pick);
      return { wrap, get file() { return pending; } };
    }

    const toastWrap = el('div', 'toast-wrap');
    document.body.appendChild(toastWrap);
    function toast(msg, type = 'ok') {
      const t = el('div', 'toast ' + (type === 'err' ? 'toast-err' : 'toast-ok'), msg);
      toastWrap.appendChild(t);
      requestAnimationFrame(() => t.classList.add('in'));
      setTimeout(() => {
        t.classList.remove('in');
        setTimeout(() => t.remove(), 350);
      }, type === 'err' ? 4500 : 2400);
    }
    const flashNote = (text) => { toast(text); updateStats(); };

    function updateStats() {
      const chips = summaryEl.querySelectorAll('.stat b');
      if (chips.length !== 3) return;
      chips[0].textContent = document.querySelectorAll('.category').length;
      chips[1].textContent = document.querySelectorAll('.section').length;
      chips[2].textContent = document.querySelectorAll('.sec-body .row').length;
    }

    const refreshCount = (body) => {
      const n = body.querySelectorAll('.row').length;
      const countEl = body.parentElement.querySelector('.sec-count');
      if (countEl) countEl.textContent = `${n} item${n === 1 ? '' : 's'}`;
    };

    function confirmDelete(item, row) {
      const main = row.querySelector('.row-main');
      const panel = el('div', 'row-main rf-confirm');
      const msg = el('span', 'rf-confirm-msg');
      msg.textContent = `Delete “${item.name}”?`;
      const delB = el('button', 'rf-del', 'Delete');
      delB.type = 'button';
      const cancelB = el('button', 'rf-cancel', 'Cancel');
      cancelB.type = 'button';
      cancelB.addEventListener('click', () => panel.replaceWith(main));
      panel.appendChild(msg);
      panel.appendChild(delB);
      panel.appendChild(cancelB);

      delB.addEventListener('click', async () => {
        delB.disabled = true; delB.textContent = 'Deleting…';
        try {
          await ensureFreshToken();
          const res = await fetch(`${SUPABASE_URL}/rest/v1/items?id=eq.${item.id}`, {
            method: 'DELETE', headers: restHeaders(),
          });
          const gone = await res.json();
          if (!res.ok || !Array.isArray(gone) || !gone.length) {
            throw new Error('Delete was rejected — did you run the policy SQL in Supabase?');
          }
          const body = row.parentElement;
          row.style.height = row.offsetHeight + 'px';
          void row.offsetHeight;
          row.classList.add('row-out');
          setTimeout(() => { row.remove(); refreshCount(body); updateStats(); }, 320);
          deleteStorageImage(item.img);
          flashNote('Deleted ✓');
        } catch (err) {
          console.error('[admin] delete failed:', err);
          toast(err.message || 'Deleting failed — please try again.', 'err');
          panel.replaceWith(main);
        }
      });

      main.replaceWith(panel);
    }

    function enterAdd(sec, body, addWrap) {
      if (body.querySelector('.row-add')) return;
      const form = el('form', 'row-add row-form');

      const nameIn = el('input');
      nameIn.required = true; nameIn.placeholder = 'Name';
      const nameArIn = el('input', 'cat-name-ar');
      nameArIn.required = true; nameArIn.placeholder = 'Arabic name'; nameArIn.dir = 'rtl';
      const priceIn = el('input');
      priceIn.type = 'number'; priceIn.step = '0.001'; priceIn.min = '0';
      priceIn.required = true; priceIn.placeholder = 'Price (OMR)';
      const descIn = el('textarea');
      descIn.rows = 2; descIn.placeholder = 'Description (optional)';
      const descArIn = el('textarea');
      descArIn.rows = 2; descArIn.placeholder = 'Arabic description (optional)'; descArIn.dir = 'rtl';

      const checkWrap = el('label', 'rf-check');
      const availIn = el('input');
      availIn.type = 'checkbox'; availIn.checked = true;
      checkWrap.appendChild(availIn);
      checkWrap.appendChild(document.createTextNode('Available (uncheck to tag as unavailable)'));

      const rowLine = el('div', 'rf-line');
      rowLine.appendChild(nameIn);
      rowLine.appendChild(priceIn);
      form.appendChild(rowLine);
      form.appendChild(nameArIn);
      form.appendChild(descIn);
      form.appendChild(descArIn);
      const photo = photoField(null);
      form.appendChild(photo.wrap);
      form.appendChild(checkWrap);

      const actions = el('div', 'rf-actions');
      const saveB = el('button', 'rf-save', 'Add item');
      saveB.type = 'submit';
      const cancelB = el('button', 'rf-cancel', 'Cancel');
      cancelB.type = 'button';
      cancelB.addEventListener('click', () => form.remove());
      actions.appendChild(saveB);
      actions.appendChild(cancelB);
      form.appendChild(actions);

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const price = parseFloat(priceIn.value);
        if (!nameIn.value.trim() || !nameArIn.value.trim() || !(price >= 0)) return;
        saveB.disabled = true; saveB.textContent = 'Adding…';
        try {
          const nextSort = Math.max(0, ...sec.items.map(i => i.sort || 0)) + 10;
          const payload = {
            section_id: sec.id,
            name: nameIn.value.trim(),
            name_ar: nameArIn.value.trim(),
            description: descIn.value.trim() || null,
            description_ar: descArIn.value.trim() || null,
            price: price,
            is_available: availIn.checked,
            sort_order: nextSort,
          };
          if (photo.file) {
            saveB.textContent = 'Uploading photo…';
            payload.image_url = await uploadImage(photo.file);
            saveB.textContent = 'Adding…';
          }
          await ensureFreshToken();
          const res = await fetch(`${SUPABASE_URL}/rest/v1/items`, {
            method: 'POST', headers: restHeaders(), body: JSON.stringify(payload),
          });
          const created = await res.json();
          if (!res.ok || !Array.isArray(created) || !created.length) {
            throw new Error('Adding was rejected — did you run the policy SQL in Supabase?');
          }
          const item = {
            id: created[0].id,
            name: payload.name,
            name_ar: payload.name_ar,
            price: price.toFixed(3),
            desc: payload.description,
            desc_ar: payload.description_ar,
            img: payload.image_url || null,
            sort: nextSort,
            subsection: null,
            variants: [],
            available: payload.is_available,
          };
          sec.items.push(item);
          form.remove();
          body.querySelector('.empty-note')?.remove();
          const newRow = makeRow(item);
          newRow.classList.add('row-new');
          body.insertBefore(newRow, addWrap);
          refreshCount(body);
          flashNote('Added ✓');
        } catch (err) {
          console.error('[admin] add failed:', err);
          toast(err.message || 'Adding failed — please try again.', 'err');
          saveB.disabled = false; saveB.textContent = 'Add item';
        }
      });

      body.insertBefore(form, addWrap);
      nameIn.focus();
    }

    function makeRow(item) {
      const row = el('div', 'row' + (item.available ? '' : ' row-off'));
      row.dataset.id = item.id;
      row.dataset.search = `${item.name} ${item.desc || ''}`.toLowerCase();

      const grip = el('span', 'grip');
      grip.innerHTML = GRIP_SVG;
      grip.addEventListener('pointerdown', (e) => startDrag(e, row));
      row.appendChild(grip);

      const thumb = el('span', 'thumb' + (item.img ? '' : ' thumb-brand'));
      const img = document.createElement('img');
      img.src = item.img || 'assets/images/logo.webp';
      img.alt = ''; img.loading = 'lazy';
      img.onerror = () => img.remove();
      thumb.appendChild(img);
      row.appendChild(thumb);

      row.appendChild(buildMain(item, row));
      return row;
    }

    function buildMain(item, row) {
      const main = el('div', 'row-main');
      const top = el('div', 'row-top');
      top.appendChild(el('span', 'item-name', item.name));
      top.appendChild(el('span', 'dots'));
      top.appendChild(el('span', 'price', item.price));
      if (!item.available) top.appendChild(el('span', 'chip chip-off', 'unavailable'));
      const availBtn = el('button', 'edit-btn avail-btn' + (item.available ? '' : ' avail-off'));
      availBtn.type = 'button';
      availBtn.title = item.available ? 'Available — click to mark unavailable' : 'Unavailable — click to mark available';
      availBtn.innerHTML = item.available ? EYE_SVG : EYE_OFF_SVG;
      availBtn.addEventListener('click', () => toggleAvailability(item, row, availBtn));
      top.appendChild(availBtn);
      const editBtn = el('button', 'edit-btn');
      editBtn.type = 'button';
      editBtn.title = 'Edit item';
      editBtn.innerHTML = EDIT_SVG;
      editBtn.addEventListener('click', () => enterEdit(item, row));
      top.appendChild(editBtn);
      const delBtn = el('button', 'edit-btn del-btn');
      delBtn.type = 'button';
      delBtn.title = 'Delete item';
      delBtn.innerHTML = TRASH_SVG;
      delBtn.addEventListener('click', () => confirmDelete(item, row));
      top.appendChild(delBtn);
      main.appendChild(top);
      if (item.desc) main.appendChild(el('p', 'desc', item.desc));
      if (item.variants.length) {
        const chips = el('div', 'chips');
        item.variants.forEach(v => chips.appendChild(el('span', 'chip', v)));
        main.appendChild(chips);
      }
      return main;
    }

    async function toggleAvailability(item, row, btn) {
      const next = !item.available;
      btn.disabled = true;
      try {
        await ensureFreshToken();
        const res = await fetch(`${SUPABASE_URL}/rest/v1/items?id=eq.${item.id}`, {
          method: 'PATCH',
          headers: restHeaders(),
          body: JSON.stringify({ is_available: next }),
        });
        const updated = await res.json();
        if (!res.ok || !Array.isArray(updated) || !updated.length) {
          throw new Error('Update was rejected — did you run the policy SQL in Supabase?');
        }
        item.available = next;
        row.classList.toggle('row-off', !item.available);
        row.querySelector('.row-main').replaceWith(buildMain(item, row));
        flashNote(item.available ? 'Available ✓' : 'Marked unavailable ✓');
      } catch (err) {
        console.error('[admin] availability toggle failed:', err);
        toast(err.message || 'Update failed — please try again.', 'err');
        btn.disabled = false;
      }
    }

    function enterEdit(item, row) {
      const main = row.querySelector('.row-main');
      const form = el('form', 'row-main row-form');

      const nameIn = el('input');
      nameIn.value = item.name; nameIn.required = true; nameIn.placeholder = 'Name';
      const nameArIn = el('input', 'cat-name-ar');
      nameArIn.value = item.name_ar || ''; nameArIn.required = true; nameArIn.placeholder = 'Arabic name'; nameArIn.dir = 'rtl';
      const priceIn = el('input');
      priceIn.type = 'number'; priceIn.step = '0.001'; priceIn.min = '0';
      priceIn.value = item.price; priceIn.required = true; priceIn.placeholder = 'Price (OMR)';
      const descIn = el('textarea');
      descIn.value = item.desc || ''; descIn.rows = 2; descIn.placeholder = 'Description (optional)';

      descArIn.value = item.desc_ar || ''; descArIn.rows = 2; descArIn.placeholder = 'Arabic description (optional)'; descArIn.dir = 'rtl';

      const checkWrap = el('label', 'rf-check');
      const availIn = el('input');
      availIn.type = 'checkbox'; availIn.checked = item.available;
      checkWrap.appendChild(availIn);
      checkWrap.appendChild(document.createTextNode('Available (uncheck to tag as unavailable)'));

      const rowLine = el('div', 'rf-line');
      rowLine.appendChild(nameIn);
      rowLine.appendChild(priceIn);
      form.appendChild(rowLine);
      form.appendChild(nameArIn);
      form.appendChild(descIn);
      form.appendChild(descArIn);

      form.appendChild(photo.wrap);
      form.appendChild(checkWrap);

      const actions = el('div', 'rf-actions');
      const saveB = el('button', 'rf-save', 'Save');
      saveB.type = 'submit';
      const cancelB = el('button', 'rf-cancel', 'Cancel');
      cancelB.type = 'button';
      cancelB.addEventListener('click', () => form.replaceWith(buildMain(item, row)));
      actions.appendChild(saveB);
      actions.appendChild(cancelB);
      form.appendChild(actions);

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const price = parseFloat(priceIn.value);
        if (!nameIn.value.trim() || !nameArIn.value.trim() || !(price >= 0)) return;
        saveB.disabled = true; saveB.textContent = 'Saving…';
        try {
          const payload = {
            name: nameIn.value.trim(),
            name_ar: nameArIn.value.trim(),
            description: descIn.value.trim() || null,
            description_ar: descArIn.value.trim() || null,
            price: price,
            is_available: availIn.checked,
          };
          if (photo.file) {
            saveB.textContent = 'Uploading photo…';
            payload.image_url = await uploadImage(photo.file);
            saveB.textContent = 'Saving…';
          }
          await ensureFreshToken();
          const res = await fetch(`${SUPABASE_URL}/rest/v1/items?id=eq.${item.id}`, {
            method: 'PATCH',
            headers: restHeaders(),
            body: JSON.stringify(payload),
          });
          const updated = await res.json();
          if (!res.ok || !Array.isArray(updated) || !updated.length) {
            throw new Error('Update was rejected — did you run the policy SQL in Supabase?');
          }
          item.name = payload.name;
          item.name_ar = payload.name_ar;
          item.desc = payload.description;
          item.desc_ar = payload.description_ar;
          row.dataset.search = `${item.name} ${item.desc || ''}`.toLowerCase();
          item.price = price.toFixed(3);
          item.available = payload.is_available;
          if (payload.image_url) {
            deleteStorageImage(item.img);
            item.img = payload.image_url;
            const thumb = row.querySelector('.thumb');
            thumb.textContent = '';
            const im = document.createElement('img');
            im.src = item.img; im.alt = '';
            thumb.appendChild(im);
          }
          row.classList.toggle('row-off', !item.available);
          form.replaceWith(buildMain(item, row));
          saveNote.classList.add('show');
          setTimeout(() => saveNote.classList.remove('show'), 3000);
        } catch (err) {
          console.error('[admin] item save failed:', err);
          toast(err.message || 'Saving failed — please try again.', 'err');
          saveB.disabled = false; saveB.textContent = 'Save';
        }
      });

      main.replaceWith(form);
      nameIn.focus();
    }

    function iconPicker(initialSvg) {

        b.innerHTML = ic.svg;
        if (ic.svg === selected) b.classList.add('selected');
        b.addEventListener('click', () => {
          selected = ic.svg;
          grid.querySelectorAll('.icon-opt').forEach(o => o.classList.toggle('selected', o === b));
        });
        grid.appendChild(b);
      });
      return { grid, get value() { return selected; } };

    function makeSection(cat, sec) {
      const secBox = el('div', 'section cat-' + cat.slug);
      secBox.dataset.id = sec.id;
      if (cat.color) {
        secBox.classList.add('has-tint');
        secBox.style.setProperty('--cat-tint', cat.color);
      }
      const secHead = el('button', 'sec-head');
      secHead.type = 'button';
      const secGrip = el('span', 'grip grip-sm');
      secGrip.innerHTML = GRIP_SVG;
      secGrip.title = 'Drag to reorder sections';
      secGrip.addEventListener('click', (e) => e.stopPropagation());
      secGrip.addEventListener('pointerdown', (e) => {
        e.stopPropagation();
        startBoxDrag(e, secBox, '.section', () => { secBox.parentElement.dataset.dirtySecs = '1'; });
      });
      secHead.appendChild(secGrip);
      const ico = el('span', 'sec-icon');
      if (sec.icon) ico.innerHTML = sec.icon;
      secHead.appendChild(ico);
      const titleEl = el('span', 'sec-title', sec.name);
      secHead.appendChild(titleEl);
      secHead.appendChild(el('span', 'sec-count', sec.items.length + ' items'));

      const secEdit = el('span', 'edit-btn sec-edit');
      secEdit.title = 'Edit section';
      secEdit.innerHTML = EDIT_SVG;
      secEdit.addEventListener('click', (e) => {
        e.stopPropagation();
        if (secBox.querySelector('.sec-form')) return;
        const form = sectionForm({
          title: 'Edit section',
          initial: sec,
          submitLabel: 'Save',
          onCancel: () => form.remove(),
          onSubmit: async ({ name, name_ar, icon }) => {
            await ensureFreshToken();
            const res = await fetch(`${SUPABASE_URL}/rest/v1/sections?id=eq.${sec.id}`, {
              method: 'PATCH', headers: restHeaders(), body: JSON.stringify({ name, name_ar, icon }),
            });
            const updated = await res.json();
            if (!res.ok || !Array.isArray(updated) || !updated.length) {
              throw new Error('Update was rejected — did you run the policy SQL in Supabase?');
            }
            sec.name = name;
            sec.name_ar = name_ar;
            sec.icon = icon;
            titleEl.textContent = name;
            ico.innerHTML = icon;
            form.remove();
            flashNote('Saved ✓');
          },
        });
        secHead.after(form);
      });
      secHead.appendChild(secEdit);

      const secDel = el('span', 'edit-btn del-btn sec-edit');
      secDel.title = 'Delete section';
      secDel.innerHTML = TRASH_SVG;
      secDel.addEventListener('click', (e) => {
        e.stopPropagation();
        if (secBox.querySelector('.sec-form, .sec-confirm')) return;
        const n = secBox.querySelectorAll('.sec-body .row').length;
        const panel = el('div', 'sec-form sec-confirm');
        const msg = el('p', 'rf-confirm-msg');
        msg.textContent = n
          ? `Delete “${sec.name}” and the ${n} item${n === 1 ? '' : 's'} inside it? This cannot be undone.`
          : `Delete “${sec.name}”? This cannot be undone.`;
        const actions = el('div', 'rf-actions');
        const delB = el('button', 'rf-del', 'Delete section');
        delB.type = 'button';
        const cancelB = el('button', 'rf-cancel', 'Cancel');
        cancelB.type = 'button';
        cancelB.addEventListener('click', () => panel.remove());
        actions.appendChild(delB);
        actions.appendChild(cancelB);
        panel.appendChild(msg);
        panel.appendChild(actions);

        delB.addEventListener('click', async () => {
          delB.disabled = true; delB.textContent = 'Deleting…';
          try {
            await ensureFreshToken();
            const res = await fetch(`${SUPABASE_URL}/rest/v1/sections?id=eq.${sec.id}`, {
              method: 'DELETE', headers: restHeaders(),
            });
            const gone = await res.json();
            if (!res.ok || !Array.isArray(gone) || !gone.length) {
              throw new Error('Delete was rejected — did you run the policy SQL in Supabase?');
            }
            cat.sections.splice(cat.sections.indexOf(sec), 1);
            secBox.classList.add('sec-out');
            setTimeout(() => { secBox.remove(); updateStats(); }, 300);
            sec.items.forEach(i => deleteStorageImage(i.img));
            flashNote('Deleted ✓');
          } catch (err) {
            console.error('[admin] section delete failed:', err);
            toast(err.message || 'Deleting failed — please try again.', 'err');
            panel.remove();
          }
        });

        secHead.after(panel);
      });
      secHead.appendChild(secDel);

      const chev = el('span', 'sec-chev');
      chev.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>';
      secHead.appendChild(chev);
      secHead.addEventListener('click', () => secBox.classList.toggle('open'));
      secBox.appendChild(secHead);

      const body = el('div', 'sec-body');
      if (!sec.items.length) body.appendChild(el('p', 'empty-note', 'No items yet — use “+ Add item” below.'));
      let lastSub = null;
      sec.items.forEach(item => {
        if (item.subsection && item.subsection !== lastSub) {
          body.appendChild(el('div', 'subhead', item.subsection));

      addWrap.appendChild(addBtn);
      body.appendChild(addWrap);
      secBox.appendChild(body);
      return secBox;

    function runAdminSearch(raw) {
      const q = raw.trim().toLowerCase();
      document.querySelectorAll('.category').forEach(catBox => {
        let catHits = 0;
        catBox.querySelectorAll('.section').forEach(secBox => {
          let hits = 0;
          secBox.querySelectorAll('.row').forEach(row => {
            const match = !q || (row.dataset.search || '').includes(q);
            row.classList.toggle('row-hidden', !match);
            if (match) hits++;
          });
          secBox.classList.toggle('search-hidden', !!q && !hits);
          if (q && hits) secBox.classList.add('open');
          catHits += hits;
        });
        catBox.classList.toggle('search-hidden', !!q && !catHits);
      });
      document.querySelectorAll('.add-cat-wrap, .add-sec-wrap').forEach(w =>
        w.classList.toggle('search-hidden', !!q));
    }

    function render(data) {
      MENU = data;

      data.forEach(cat => {
        cat.sections.forEach(sec => {

            });

            if (!res.ok || !Array.isArray(created) || !created.length) {

            const cat = {

              emoji: emoji || '', color,
              slug: name.toLowerCase().replace(/[^a-z0-9]+/g, '-'),

        + `<span class="stat"><b>${itemCount}</b> items</span>`
        + `<span class="summary-hint">Live from the database — drag the dots to reorder items.</span>`;

    /* ---------- save ---------- */
    async function saveOrder() {
      saveBtn.disabled = true;
      saveBtn.textContent = 'Saving…';
      try {
        const bodies = [...document.querySelectorAll('.sec-body[data-dirty]')];
        for (const body of bodies) {
          const rows = [...body.querySelectorAll('.row')];
          for (let i = 0; i < rows.length; i++) {
            await ensureFreshToken();
            const res = await fetch(`${SUPABASE_URL}/rest/v1/items?id=eq.${rows[i].dataset.id}`, {
              method: 'PATCH',
              headers: restHeaders(),
              body: JSON.stringify({ sort_order: (i + 1) * 10 }),
            });
            const updated = await res.json();
            if (!res.ok || !Array.isArray(updated) || !updated.length) {
              throw new Error('Update was rejected — did you run the policy SQL in Supabase?');
            }
          }
          delete body.dataset.dirty;
        }
        for (const catBox of [...document.querySelectorAll('.category[data-dirty-secs]')]) {
          const secs = [...catBox.querySelectorAll(':scope > .section')];
          for (let i = 0; i < secs.length; i++) {
            await ensureFreshToken();
            const res = await fetch(`${SUPABASE_URL}/rest/v1/sections?id=eq.${secs[i].dataset.id}`, {
              method: 'PATCH', headers: restHeaders(),
              body: JSON.stringify({ sort_order: (i + 1) * 10 }),
            });
            const updated = await res.json();
            if (!res.ok || !Array.isArray(updated) || !updated.length) {
              throw new Error('Update was rejected — sign in again and retry.');
            }
          }
          delete catBox.dataset.dirtySecs;
        }
        if (root.dataset.dirtyCats) {
          const cats = [...root.querySelectorAll(':scope > .category')];
          for (let i = 0; i < cats.length; i++) {
            await ensureFreshToken();
            const res = await fetch(`${SUPABASE_URL}/rest/v1/categories?id=eq.${cats[i].dataset.id}`, {
              method: 'PATCH', headers: restHeaders(),
              body: JSON.stringify({ sort_order: (i + 1) * 10 }),
            });
            const updated = await res.json();
            if (!res.ok || !Array.isArray(updated) || !updated.length) {
              throw new Error('Update was rejected — sign in again and retry.');
            }
          }
          delete root.dataset.dirtyCats;
        }
        saveBtn.classList.remove('show');
        saveNote.classList.add('show');
        setTimeout(() => saveNote.classList.remove('show'), 3000);
      } catch (err) {
        console.error('[admin] save failed:', err);
        toast(err.message || 'Saving failed — please try again.', 'err');
      } finally {
        saveBtn.disabled = false;
        saveBtn.textContent = 'Save order';
      }
    }
    saveBtn.addEventListener('click', saveOrder);

    /* ---------- auth gate + boot ---------- */
    const loginOverlay = document.querySelector('[data-login]');
    const loginForm = document.querySelector('[data-login-form]');
    const loginErr = document.querySelector('[data-login-err]');
    const signoutBtn = document.querySelector('[data-signout]');

    function boot() {
      loginOverlay.classList.remove('show');
      signoutBtn.hidden = false;
      summaryEl.textContent = 'Loading menu…';
      renderSkeleton();
      loadMenu()
        .then(render)
        .catch(err => {
          console.error('[admin] menu fetch failed:', err);
          summaryEl.textContent = 'Could not load the menu from the database — check your connection and reload.';
        });
    }

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      loginErr.classList.remove('show');
      const submitB = loginForm.querySelector('.login-submit');
      submitB.disabled = true;
      try {
        const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
          method: 'POST',
          headers: { apikey: SUPABASE_ANON_KEY, 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('adm-email').value.trim(),
            password: document.getElementById('adm-pass').value,
          }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error_description || data.msg || 'Sign in failed');
        storeSession(data);
        document.getElementById('adm-pass').value = '';
        boot();
      } catch (err) {
        loginErr.textContent = err.message;
        loginErr.classList.add('show');
      } finally {
        submitB.disabled = false;
      }
    });

    signoutBtn.addEventListener('click', () => {
      [TOKEN_KEY, REFRESH_KEY, TOKEN_AT_KEY].forEach(k => sessionStorage.removeItem(k));
      location.reload();
    });

    if (sessionStorage.getItem(TOKEN_KEY)) {
      boot();
    } else {
      loginOverlay.classList.add('show');
    }
  </script>
</body>
</html>
